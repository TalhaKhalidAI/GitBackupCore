# alembic.ini

[alembic]
# path to migration scripts
script_location = alembic
# template used to generate migration files
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d_%%(minute).2d_%%(second).2d_%%(slug)s
# timezone to use when rendering the date within the migration file as well as the filename.
timezone = UTC
# max length of characters to apply to the "slug" field
truncate_slug_length = 40
# set to 'true' to run the environment during 'revision' command
revision_environment = false

# database url
sqlalchemy.url = sqlite:///./App/api/databases/git.db

# version table name
version_locations = %(here)s/alembic/versions

# python module containing the target metadata
# target_metadata = myapp.mymodel.Base

# encoding
encoding = utf-8

# ============================================================
# Post write hooks
# ============================================================
[post_write_hooks]
hooks = black
black.type = console_scripts
black.entrypoint = black
black.options = -l 88

# ============================================================
# Logging configuration
# ============================================================
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S